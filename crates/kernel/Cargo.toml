# Requires `build.rs` to have set ONCRIX_INIT_BIN before compilation.
embed-init = []

[dependencies]
oncrix-lib.workspace = true
oncrix-hal.workspace = true
oncrix-mm.workspace = true
oncrix-ipc.workspace = true
oncrix-process.workspace = true
oncrix-syscall.workspace = true
oncrix-vfs.workspace = true
