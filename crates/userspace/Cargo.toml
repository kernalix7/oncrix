#
# Nested workspace for ONCRIX userspace crates (init, sh, libc).
#
# Kept separate from the root kernel workspace so it doesn't inherit the
# kernel linker script, `code-model=kernel`, or higher-half link address.
# The kernel's build.rs invokes `cargo build --manifest-path` on this file
# when the `embed-init` feature is enabled.

[workspace]
members = ["init", "sh", "libc", "echo", "cat", "true", "false", "wc", "head", "tail", "pwd", "env", "uname", "ls", "sigtest", "mmaptest", "sleep", "yes", "clear", "whoami", "kill", "basename", "dirname", "seq", "test", "tee", "tr", "cut", "uniq", "grep", "printf", "sort", "od", "expr", "touch", "cp", "rm", "mkdir", "cmp", "date", "comm", "paste", "nl", "rev", "tac", "xargs", "cksum", "fold", "realpath", "cal", "stat", "which", "sum", "uptime", "factor", "expand", "unexpand", "split"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
authors = ["Kim DaeHyun <kernalix7@kodenet.io>"]
repository = "https://github.com/kernalix7/oncrix"

[workspace.dependencies]
oncrix-ulibc = { path = "libc" }
