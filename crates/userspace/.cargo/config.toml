#
# Cargo config for the userspace nested workspace.
#
# Keeps userspace builds isolated from the kernel's workspace-wide rustflags
# (kernel linker script + `code-model=kernel`). Applies only when cargo is
# invoked inside crates/userspace/ or via `--manifest-path`.

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "relocation-model=static",
]
