name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

  qemu-boot:
    name: QEMU Boot Integration Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none, aarch64-unknown-none, riscv64gc-unknown-none-elf

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-system-misc

      - name: Verify QEMU binaries are present
        # The harness skips an architecture when its emulator is missing from
        # PATH. Assert all three exist so a broken install cannot turn into a
        # silent skip that still reports green.
        run: |
          for q in qemu-system-x86_64 qemu-system-aarch64 qemu-system-riscv64; do
            command -v "$q" || { echo "::error::$q not installed"; exit 1; }
          done

      - name: Build kernels
        run: |
          cargo build -p oncrix-kernel --target x86_64-unknown-none
          cargo build -p oncrix-kernel --bin oncrix-kernel --target aarch64-unknown-none
          cargo build -p oncrix-kernel --bin oncrix-kernel --target riscv64gc-unknown-none-elf

      - name: Build boot test harness
        # cd into the subdirectory so Cargo picks up tests/boot_tests/.cargo/config.toml
        # (target = x86_64-unknown-linux-gnu), not the repo-root config (target = x86_64-unknown-none).
        run: cd tests/boot_tests && cargo build

      - name: Run QEMU boot integration tests
        env:
          ONCRIX_PROJECT_DIR: ${{ github.workspace }}
        run: bash scripts/run-qemu-test.sh
        timeout-minutes: 12
