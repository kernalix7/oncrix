name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Rust Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

  qemu-boot:
    name: QEMU Boot Integration Test
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools
          targets: x86_64-unknown-none

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install QEMU
        run: sudo apt-get update -qq && sudo apt-get install -y qemu-system-x86

      - name: Build kernel
        run: cargo build -p oncrix-kernel --target x86_64-unknown-none

      - name: Build boot test harness
        run: cargo build --manifest-path tests/boot_tests/Cargo.toml

      - name: Run QEMU boot integration tests
        env:
          ONCRIX_PROJECT_DIR: ${{ github.workspace }}
        run: bash scripts/run-qemu-test.sh
        timeout-minutes: 2
